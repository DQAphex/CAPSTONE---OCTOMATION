name: Update submodules

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          git submodule update --init tenants
          git submodule update --init iam-service
          git submodule update --init billing
          git submodule update --init plataforma-backend

      - name: Update tenants
        run: |
          cd tenants
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Update IAM
        run: |
          cd iam-service
          git fetch origin master
          git checkout master
          git reset --hard origin/master

      - name: Update billing
        run: |
          cd billing
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Update plataforma backend
        run: |
          cd plataforma-backend
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No hay cambios en los submodulos."
          else
            git add .
            git commit -m "chore: actualizar submodulos"
            git push
          fi